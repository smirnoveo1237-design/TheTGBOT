<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Игровая — мини-приложение</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button id="back" class="icon-btn hidden" aria-label="Назад">←</button>
      <div class="titles">
        <h1 id="title">🎮 Игровая</h1>
        <p id="subtitle">Выбери игру — рекорды хранятся на устройстве</p>
      </div>
      <div id="score" class="score"></div>
    </header>

    <main id="hub" class="hub"></main>

    <section id="screen" class="screen hidden">
      <div id="area" class="area"></div>
      <div id="actions" class="actions"></div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
